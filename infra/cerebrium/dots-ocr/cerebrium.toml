[cerebrium.deployment]
name = "dots-ocr"
python_version = "3.12"
include = ["main.py", "cerebrium.toml"]
docker_base_image_url = "nvidia/cuda:12.1.0-runtime-ubuntu22.04"

[cerebrium.hardware]
cpu = 2
memory = 14.0
compute = "AMPERE_A10"
gpu_count = 1

[cerebrium.scaling]
min_replicas = 0
max_replicas = 2
cooldown = 60

[cerebrium.dependencies.pip]
vllm = "latest"
huggingface-hub = "latest"
