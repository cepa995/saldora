name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check apps/api/ workers/ packages/ml/

      - name: Ruff format check
        run: ruff format --check apps/api/ workers/ packages/ml/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm -w @fakturaai/web run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx -w @fakturaai/web tsc --noEmit

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fakturaai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # CI-only test credentials (not used in production)
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fakturaai_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fakturaai_test
      JWT_SECRET_KEY: test-only-not-a-secret
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install Python dependencies
        run: |
          pip install --no-deps -e packages/ml
          cd apps/api && pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: cd apps/api && alembic upgrade head

      - name: Run tests with coverage
        run: |
          cd apps/api
          python -m pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=75

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml

  test-web:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: |
          npm -w @fakturaai/web run test -- \
            --coverage \
            --coverage.reporter=text \
            --coverage.reporter=clover

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-api, test-web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm -w @fakturaai/web run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Build API Docker image
        run: docker build -t fakturaai-api:ci -f apps/api/Dockerfile .

      - name: Build Web Docker image
        run: >
          docker build -t fakturaai-web:ci
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000
          -f apps/web/Dockerfile .

      - name: Build Worker Docker image
        run: docker build -t fakturaai-worker:ci -f workers/Dockerfile .
