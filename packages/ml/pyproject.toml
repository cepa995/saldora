[project]
name = "fakturaai-ml"
version = "0.1.0"
description = "Saldora ML Pipeline - OCR and invoice data extraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core ML
    "torch>=2.2.0",
    "torchvision>=0.17.0",

    # OCR engines
    "easyocr>=1.7.0",
    "transformers>=4.46.0",
    "accelerate>=1.0.0",

    # Document processing
    "pymupdf>=1.24.0",
    "pillow>=11.0.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",

    # NER and text processing
    "spacy>=3.7.0",

    # Validation
    "pydantic>=2.10.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "regex>=2024.0.0",
]

[project.optional-dependencies]
# dots.ocr support (requires vLLM)
dots = [
    "vllm>=0.6.0",
]

# Development
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

# Full GPU inference
gpu = [
    "vllm>=0.6.0",
    "flash-attn>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fakturaai_ml"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["playground/docs.ocr"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
